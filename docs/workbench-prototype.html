                  escapeText(prompt.box.parentCode) +
                  '，是否需要换绑</div>',

                '否',

          // Independent prototype fixtures for the new relationship; no loading-slot data is reused.
          var relationCarts = new Map();
          var relationBoxes = new Map();

          function resetContainerExamples() {
            relationCarts.clear();
            relationBoxes.clear();
            [
              ['CAR-REL-001', '一号周转料车'],
              ['CAR-REL-002', '二号周转料车'],
              ['CAR-REL-EMPTY', '空料车'],
              ['CAR-REL-LONG', '多箱料车'],
            ].forEach(function (item) {
              relationCarts.set(item[0], { code: item[0], name: item[1], version: 1 });
            });
            for (var i = 1; i <= 30; i += 1) {
              var suffix = String(i).padStart(2, '0');
              relationBoxes.set('BOX-REL-NEW-' + suffix, {
                code: 'BOX-REL-NEW-' + suffix,
                name: '周转料箱 ' + suffix,
                parentCode: null,
                version: 1,
              });
              relationBoxes.set('BOX-REL-LONG-' + suffix, {
                code: 'BOX-REL-LONG-' + suffix,
                name: '周转料箱 ' + suffix,
                parentCode: 'CAR-REL-LONG',
                version: 1,
              });
              if (i <= 3)
                relationBoxes.set('BOX-REL-BOUND-' + suffix, {
                  code: 'BOX-REL-BOUND-' + suffix,
                  name: '已绑定料箱 ' + suffix,
                  parentCode: 'CAR-REL-001',
                  version: 1,
                });
            }
            relationBoxes.set('BOX-REL-OTHER', {
              code: 'BOX-REL-OTHER',
              name: '周转料箱',
              parentCode: 'CAR-REL-002',
              version: 1,
            });
          }

          function queryContainerRelation(code, afterSuccess) {
            var binding = state.screen === 'container-bind';
            var model = containerRelationModel();
            if (!model.cart) {
              runQuery(
                '正在查询料车…',
                function () {
                  mockRequest('container-relations-cart', { scanCode: code }, null);
                  if (code === 'CAR-REL-SCAN-FAIL') throw new Error('料车信息查询失败，请检查编码后重试');
                  var cart = relationCarts.get(code);
                  if (!cart)
                    throw new Error(
                      relationBoxes.has(code) ? '当前需要扫描料车，请核对容器类型' : '容器编码不存在：' + code,
                    );
                  return {
                    cart: Object.assign({}, cart),
                    boxes: Array.from(relationBoxes.values())
                      .filter(function (box) {
                        return box.parentCode === cart.code;
                      })
                      .map(function (box) {
                        return Object.assign({}, box);
                      }),
                  };
                },
                function (result) {
                  model.cart = result.cart;
                  model.boxes = binding ? [] : result.boxes;
                  model.selected = [];
                  if (binding) {
                    model.bound = [];
                    if (result.boxes.length) state.containerPrompt = { kind: 'initial-unbind', boxes: result.boxes };
                  }
                },
                afterSuccess,
              );
              return;
            }
            if (!binding) {
              var matched = model.boxes.find(function (box) {
                return box.code === code;
              });
              if (!matched) {
                showToast('该料箱不在当前料车的已绑定列表中');
                return;
              }
              if (model.selected.indexOf(code) >= 0) {
                showToast('该料箱已勾选', true);
                return;
              }
              model.selected.push(code);
              render();
              showToast('已勾选料箱 ' + code, true);
              return;
            }
            if (
              model.boxes.some(function (box) {
                return box.code === code;
              })
            ) {
              showToast('重复扫码，该料箱已在待绑定列表中');
              return;
            }
            runQuery(
              '正在查询料箱…',
              function () {
                mockRequest('container-relations-box', { scanCode: code, cartCode: model.cart.code }, null);
                var box = relationBoxes.get(code);
                if (!box)
                  throw new Error(relationCarts.has(code) ? '当前需要扫描料箱，请核对容器类型' : '容器编码不存在：' + code);
                if (box.parentCode === model.cart.code) throw new Error('已绑定当前料车');
                return Object.assign({}, box);
              },
              function (box) {
                if (box.parentCode) state.containerPrompt = { kind: 'rebind', box: box };
                else model.boxes.push(box);
              },
              afterSuccess,
            );
          }

          function mutateContainerRelations(binding, boxes) {
            var model = containerRelationModel();
            mockRequest(
              binding ? 'container-relations-bind' : 'container-relations-unbind',
              {
                cartCode: model.cart.code,
                boxCodes: boxes.map(function (box) {
                  return box.code;
                }),
                all: !binding && ['all', 'initial-unbind'].indexOf(state.containerPrompt.kind) >= 0,
              },
              null,
            );
            if (model.failNextSubmission) {
              model.failNextSubmission = false;
              throw new Error('提交失败：服务暂不可用，请再次提交');
            }
            var cart = relationCarts.get(model.cart.code);
            if (
              cart.version !== model.cart.version ||
              boxes.some(function (box) {
                var current = relationBoxes.get(box.code);
                return !current || current.version !== box.version || current.parentCode !== box.parentCode;
              })
            )
              throw new Error('绑定关系已发生变化，本次整批操作未执行，请清空页面后重新扫描');
            // Validate the entire batch before changing any relationship.
            boxes.forEach(function (box) {
              var current = relationBoxes.get(box.code);
              if (current.parentCode && current.parentCode !== cart.code) relationCarts.get(current.parentCode).version += 1;
              current.parentCode = binding ? cart.code : null;
              current.version += 1;
            });
            cart.version += 1;
          }

          function startContainerExample(example) {
            clearPage();
            resetContainerExamples();
            var binding = state.screen === 'container-bind';
            var model = containerRelationModel();
            model.failNextSubmission = example === 'submit-fail' || example === 'unbind-fail';
            queryContainerRelation(
              example === 'scan-fail'
                ? 'CAR-REL-SCAN-FAIL'
                : (example === 'long' && !binding) || example === 'existing-long'
                  ? 'CAR-REL-LONG'
                  : example === 'empty' ||
                      (binding && ['existing', 'unbind-fail', 'unbind-changed', 'existing-long'].indexOf(example) < 0)
                    ? 'CAR-REL-EMPTY'
                    : 'CAR-REL-001',
              function () {
                if (example === 'unbind-changed') relationCarts.get(model.cart.code).version += 1;
                if (!binding) {
                  if (example === 'changed') relationCarts.get(model.cart.code).version += 1;
                  return;
                }
                if (example === 'long') {
                  model.boxes = Array.from(relationBoxes.values())
                    .filter(function (box) {
                      return !box.parentCode;
                    })
                    .slice(0, 24)
                    .map(function (box) {
                      return Object.assign({}, box);
                    });
                  render();
                } else if (example === 'rebind') queryContainerRelation('BOX-REL-OTHER');
                else if (example === 'submit-fail' || example === 'changed')
                  queryContainerRelation('BOX-REL-NEW-01', function () {
                    if (example === 'changed') {
                      var changed = relationBoxes.get('BOX-REL-NEW-01');
                      changed.parentCode = 'CAR-REL-002';
                      changed.version += 1;
                      relationCarts.get(changed.parentCode).version += 1;
                    }
                  });
              },
            );
          }

          resetContainerExamples();

          function canMaterialCallSubmit() {
            var call = state.materialCall;
            return (
              !state.busy &&
              !call.attempt &&
              call.location &&
              call.eligibility &&
              call.eligibility.allowed &&
              call.queriedOrder === call.order.trim() &&
              call.selected.length > 0 &&
              call.selected.length <= 1000 &&
              call.selected.every(function (code) {
                return call.boxes.some(function (box) {
                  return box.boxCode === code && box.eligibility.allowed;
                });
              })
            );
          }

          function materialCallScreen() {
            var call = state.materialCall;
            var disabled = state.busy || !!call.attempt;
            var rows = call.boxes
              .map(function (box) {
                return (
                  '<label class="nari-list-item nari-check-row"><input type="checkbox" data-material-call-box="' +
                  escapeText(box.boxCode) +
                  '" aria-label="选择 ' +
                  escapeText(box.boxCode) +
                  '"' +
                  (call.selected.indexOf(box.boxCode) >= 0 ? ' checked' : '') +
                  (disabled || !box.eligibility.allowed || !call.eligibility.allowed ? ' disabled' : '') +
                  '><span><span class="nari-list-main">' +
                  escapeText(box.boxCode) +
                  '</span>' +
                  (!box.eligibility.allowed
                    ? '<span class="nari-material-call-reason">' + escapeText(box.eligibility.reason) + '</span>'
                    : '') +
                  '</span><span class="nari-list-value">' +
                  box.materialQuantity +
                  ' 件板件</span></label>'
                );
              })
              .join('');
            var results = '';
            if (call.attempt) {
              var states = {
                QUEUED: '等待派送',
                DISPATCHED: '调度已受理',
                FAILED: '派送失败',
                UNKNOWN: '结果未知',
                COMPLETED: '运输完成',
              };
              results =
                '<div class="nari-section nari-scroll-panel"><div class="nari-section-heading"><span>叫料结果待确认</span><span>' +
                (call.receipt ? escapeText(call.receipt.callNo) : '') +
                '</span></div><div class="nari-section-body nari-list-scroll">' +
                '<div class="nari-request-id">请求标识：' +
                escapeText(call.attempt.input.requestId) +
                '</div><div class="nari-material-call-reason">' +
                escapeText(call.attempt.reason) +
                '</div>' +
                (call.receipt
                  ? call.receipt.tasks
                      .map(function (task) {
                        return (
                          '<div class="nari-list-item"><span class="nari-list-main">' +
                          escapeText(task.boxCode) +
                          ' · ' +
                          states[task.dispatchState] +
                          '</span><span class="nari-list-sub">任务编号：' +
                          escapeText(task.taskNo) +
                          '</span>' +
                          (task.reason
                            ? '<span class="nari-material-call-reason">' + escapeText(task.reason) + '</span>'
                            : '') +
                          '</div>'
                        );
                      })
                      .join('')
                  : '') +
                '<button type="button" class="nari-secondary-action" data-action="material-call-result"' +
                (state.busy ? ' disabled' : '') +
                '>查询叫料结果</button></div></div>';
            } else if (call.queriedOrder) {
              results =
                '<div class="nari-section nari-scroll-panel" data-material-call-results><div class="nari-section-heading"><span>箱子清单</span><span>已选 ' +
                call.selected.length +
                ' / ' +
                call.boxes.length +
                ' 箱</span></div><div class="nari-section-body nari-list-scroll" data-list-scroll>' +
                (!call.eligibility.allowed
                  ? '<div class="nari-material-call-reason">' + escapeText(call.eligibility.reason) + '</div>'
                  : '') +
                (rows || '<div class="nari-empty">该生产订单暂无可叫料箱子</div>') +
                '</div></div>';
            } else if (call.location) results = emptyBlock('请输入生产订单号并查询', '查询后勾选需要叫料的箱子');
            return (
              '<div class="nari-screen nari-work-screen">' +
              sequenceInput('扫描或输入位置编码', !!call.attempt) +
              (call.location
                ? detailBlock('位置信息', '已识别', [
                    ['位置编号', call.location.code],
                    ['位置名称', call.location.name],
                  ])
                : emptyBlock('请先扫描位置', '识别位置后按生产订单查询箱子')) +
              (call.location
                ? '<div class="nari-filter-stack"><input class="nari-input" data-material-call-order placeholder="请输入生产订单号" aria-label="生产订单号" value="' +
                  escapeText(call.order) +
                  '"' +
                  (disabled ? ' disabled' : '') +
                  '><button type="button" class="nari-secondary-action" data-action="material-call-query"' +
                  (!call.order.trim() || call.order.trim().length > 128 || disabled ? ' disabled' : '') +
                  '>查询</button></div>'
                : '') +
              results +
              '<div class="nari-work-footer"><button type="button" class="nari-ghost-action" data-action="clear-page"' +
              (disabled ? ' disabled' : '') +
              '>清空页面</button>' +
              '<button type="button" class="nari-primary-action" data-action="material-call-submit"' +
              (!canMaterialCallSubmit() ? ' disabled' : '') +
              '>确认叫料</button></div></div>'
            );
          }

          function queryMaterialCall(failureReason) {
            var call = state.materialCall;
            var orderNo = call.order.trim();
            if (!call.location || !orderNo || orderNo.length > 128 || state.busy || call.attempt) return;
            runQuery(
              '正在查询生产订单箱子…',
              function () {
                var samples = {
                  'MO-20261009-001': ['NORMAL', 3],
                  'MO-LONG': ['LONG', 30],
                  'MO-EMPTY': ['EMPTY', 0],
                  'MO-SUBMIT-FAIL': ['SUBMIT-FAIL', 2],
                  'MO-BOX-BLOCKED': ['BOX-BLOCKED', 3],
                  'MO-BATCH-BLOCKED': ['BATCH-BLOCKED', 2],
                  'MO-SUBMIT-UNKNOWN': ['SUBMIT-UNKNOWN', 2],
                  'MO-RESULT-FAIL': ['RESULT-FAIL', 2],
                  'MO-RESULT-MISSING': ['RESULT-MISSING', 2],
                  'MO-DISPATCH-UNKNOWN': ['DISPATCH-UNKNOWN', 2],
                  'MO-DISPATCH-FAIL': ['DISPATCH-FAIL', 2],
                };
                if (orderNo === 'MO-QUERY-FAIL') throw new Error('箱子查询失败，请稍后重试');
                var sample = samples[orderNo];
                if (!Array.isArray(sample)) throw new Error('生产订单号不存在');
                var boxes = Array.from({ length: sample[1] }, function (_, index) {
                  var code = 'BOX-MC-' + sample[0] + '-' + String(index + 1).padStart(2, '0');
                  var reserved = Object.values(materialCallHistory).some(function (reply) {
                    return reply.tasks.some(function (task) {
                      return task.boxCode === code;
                    });
                  });
                  return {
                    boxCode: code,
                    version: 1,
                    orderNo: orderNo,
                    origin: { locationCode: 'KW-' + code, locationName: '起始位' },
                    materialQuantity: sample[0] === 'LONG' ? 1 : (index + 1) * 2,
                    eligibility: reserved
                      ? { allowed: false, reason: '该箱已有未结束叫料任务' }
                      : orderNo === 'MO-BOX-BLOCKED' && index === 0
                        ? { allowed: false, reason: '该箱当前不可叫料' }
                        : { allowed: true },
                  };
                });
                return mockRequest(
                  'order-call-candidates',
                  { destinationLocationCode: call.location.code, orderNo: orderNo },
                  {
                    orderNo: orderNo,
                    destination: {
                      locationCode: call.location.code,
                      locationName: call.location.name,
                      floorCode: 'F1',
                      floorName: '一层',
                      areaCode: 'CALL',
                      areaName: '叫料接收区',
                    },
                    destinationVersion: call.location.version,
                    boxes: boxes,
                    eligibility:
                      orderNo === 'MO-BATCH-BLOCKED'
                        ? { allowed: false, reason: '当前订单暂不可叫料' }
                        : boxes.some(function (box) {
                              return box.eligibility.allowed;
                            })
                          ? { allowed: true }
                          : { allowed: false, reason: '该生产订单暂无可叫料箱子' },
                  },
                );
              },
              function (value) {
                call.boxes = value.boxes;
                call.destinationVersion = value.destinationVersion;
                call.eligibility = value.eligibility;
                call.queriedOrder = orderNo;
                call.selected = [];
              },
              function () {
                if (failureReason) showToast(failureReason);
                else if (!call.eligibility.allowed) showToast(call.eligibility.reason);
              },
              failureReason
                ? function (reason) {
                    showToast(failureReason + '；箱子清单刷新失败：' + reason);
                  }
                : null,
            );
            if (failureReason) showToast(failureReason);
          }

          function applyMaterialCallReply(call, reply) {
            call.receipt = reply;
            var exceptions = reply.tasks.filter(function (task) {
              return task.dispatchState === 'FAILED' || task.dispatchState === 'UNKNOWN';
            });
            if (
              reply.tasks.some(function (task) {
                return task.dispatchState === 'UNKNOWN';
              })
            ) {
              call.attempt.reason = exceptions
                .map(function (task) {
                  return task.boxCode + '：' + task.reason;
                })
                .join('；');
              return { text: call.attempt.reason, error: true };
            }
            call.attempt = null;
            clearPage();
            return exceptions.length
              ? {
                  text:
                    '叫料任务已创建（' +
                    reply.callNo +
                    '），派送失败：' +
                    exceptions
                      .map(function (task) {
                        return task.boxCode + '：' + task.reason;
                      })
                      .join('；'),
                  error: true,
                }
              : {
                  text: '叫料成功，已提交 ' + reply.tasks.length + ' 箱（' + reply.callNo + '），等待后台派送',
                  error: false,
                };
          }

          function checkMaterialCall() {
            var call = state.materialCall;
            if (!call.attempt || state.busy) return;
            var note;
            runQuery(
              '正在查询叫料结果…',
              function () {
                var input = call.attempt.input;
                if (input.orderNo === 'MO-RESULT-FAIL') throw new Error('叫料结果查询暂不可用');
                var reply = materialCallHistory[input.requestId];
                if (!reply) throw new Error('暂未查询到本次叫料结果');
                return mockRequest('order-call-result', { requestId: input.requestId }, reply);
              },
              function (reply) {
                note = applyMaterialCallReply(call, reply);
              },
              function () {
                showToast(note.text, !note.error);
              },
              function (reason) {
                call.attempt.reason = '叫料结果尚未确认：' + reason + '；请查询原请求，勿重复提交';
                render();
                showToast(call.attempt.reason);
              },
            );
          }

          function submitMaterialCall() {
            if (!canMaterialCallSubmit()) return;
            var call = state.materialCall;
            var input = {
              requestId: crypto.randomUUID(),
              destinationLocationCode: call.location.code,
              destinationVersion: call.destinationVersion,
              orderNo: call.queriedOrder,
              boxes: call.boxes
                .filter(function (box) {
                  return call.selected.indexOf(box.boxCode) >= 0;
                })
                .map(function (box) {
                  return { boxCode: box.boxCode, version: box.version };
                }),
            };
            call.attempt = { input: input, reason: '正在确认叫料结果，请勿重复提交' };
            var note;
            runQuery(
              '正在叫料…',
              function () {
                if (input.orderNo === 'MO-SUBMIT-FAIL') throw new Error('叫料失败，请稍后重试');
                var reply = {
                  requestId: input.requestId,
                  callNo: 'CALL-MOCK-' + Date.now(),
                  orderNo: input.orderNo,
                  destination: { locationCode: call.location.code, locationName: call.location.name },
                  createdTime: new Date().toISOString(),
                  tasks: input.boxes.map(function (box, index) {
                    return {
                      boxCode: box.boxCode,
                      taskId: String(Date.now()) + index,
                      taskNo: 'WL-CALL-' + Date.now() + '-' + index,
                      dispatchState:
                        input.orderNo === 'MO-DISPATCH-UNKNOWN'
                          ? 'UNKNOWN'
                          : input.orderNo === 'MO-DISPATCH-FAIL'
                            ? 'FAILED'
                            : 'QUEUED',
                      reason:
                        input.orderNo === 'MO-DISPATCH-UNKNOWN'
                          ? '等待核实调度受理结果'
                          : input.orderNo === 'MO-DISPATCH-FAIL'
                            ? '调度派送失败'
                            : undefined,
                    };
                  }),
                };
                mockRequest('order-call-create', input, reply);
                if (input.orderNo !== 'MO-RESULT-MISSING') materialCallHistory[input.requestId] = reply;
                if (['MO-SUBMIT-UNKNOWN', 'MO-RESULT-FAIL', 'MO-RESULT-MISSING'].indexOf(input.orderNo) >= 0)
                  throw new Error('叫料提交结果未知');
                return reply;
              },
              function (reply) {
                note = applyMaterialCallReply(call, reply);
              },
              function () {
                showToast(note.text, !note.error);
              },
              function (reason) {
                if (input.orderNo === 'MO-SUBMIT-FAIL') {
                  call.attempt = null;
                  call.boxes = [];
                  call.selected = [];
                  call.queriedOrder = '';
                  queryMaterialCall(reason);
                } else {
                  call.attempt.reason = reason + '；请勿重复提交';
                  render();
                  checkMaterialCall();
                }
              },
            );
          }

          function logisticsCreateScreen() {
            var task = state.logistics;
            return (
              '<div class="nari-screen nari-work-screen">' +
              sequenceInput('扫描或输入载具/起始位置', false) +
              (task.object
                ? detailBlock('运输信息', '已识别', [
                    ['载具/容器', task.object.code],
                    ['起始位置', task.origin.code + ' · ' + task.origin.name],
                  ])
                : emptyBlock('请扫描载具或起始位置', '系统将返回载具、起始位置和可选目标位置')) +
              (task.object
                ? '<div class="nari-section"><div class="nari-section-heading"><span>目标位置</span><span>' +
                  task.destinations.length +
                  ' 个可选</span></div><div class="nari-section-body">' +
                  (task.destinations.length
                    ? '<button type="button" class="nari-choice-field" data-action="choose-destination"><span>' +
                      (task.destination ? escapeText(locationPath(task.destination)) : '请选择终点位置') +
                      '</span><span>选择 ›</span></button>'
                    : '<div class="nari-empty">暂无可达终点</div>') +
                  '</div></div>'
                : '') +
              (task.returnLineSideEligibility?.reason

                : '') +
              '<div class="nari-work-footer nari-work-footer--three"><button type="button" class="nari-ghost-action" data-action="clear-page">清空页面</button>' +
              '<button type="button" class="nari-secondary-action" data-action="logistics-return"' +
              (!task.returnLineSideEligibility?.allowed || state.busy ? ' disabled' : '') +
              '>回库</button>' +
              '<button type="button" class="nari-primary-action" data-action="logistics-submit"' +
              (!task.object || !task.destination || state.busy ? ' disabled' : '') +
              '>确认创建</button></div></div>'
            );
          }

          function emptyCarrierCallScreen() {
            var call = state.emptyCall;
            return (
              '<div class="nari-screen nari-work-screen">' +
              sequenceInput('扫描或输入目标位置', false) +
              (call.target
                ? detailBlock('目标位置', '已识别', [
                    ['位置编号', call.target.code],
                    ['位置名称', call.target.name],
                  ])
                : emptyBlock('请扫描目标位置', '查询可用起始位置及其空载具')) +
              (call.target
                ? '<div class="nari-section"><div class="nari-section-heading"><span>起始位置</span><span>' +
                  call.origins.length +
                  ' 个可选</span></div><div class="nari-section-body">' +
                  (call.origins.length
                    ? '<button type="button" class="nari-choice-field" data-action="choose-origin"><span>' +
                      escapeText(locationPath(call.origin)) +
                      '</span><span>切换 ›</span></button><div class="nari-choice-meta"><span>空载具</span><span>' +
                      escapeText(call.origin.carrierCode) +
                      '</span></div>'
                    : '<div class="nari-empty">暂无可用空载具</div>') +
                  '</div></div>'
                : '') +
              '<div class="nari-work-footer"><button type="button" class="nari-ghost-action" data-action="clear-page">清空页面</button>' +
              '<button type="button" class="nari-primary-action" data-action="empty-call-submit"' +
              (!call.target || !call.origin || state.busy ? ' disabled' : '') +
              '>确认呼叫</button></div></div>'
            );
          }

          function logisticsCancelScreen() {
            var tasks = state.cancelTasks;
            var cards = tasks.items
              .map(function (task) {
                return (
                  '<div class="nari-task-card" data-cancel-task="' +
                  escapeText(task.id) +
                  '"><div class="nari-task-card-head"><span class="nari-list-main">' +
                  escapeText(task.id) +
                  '</span><span class="nari-tag">' +
                  escapeText(task.brand) +
                  '</span></div><div class="nari-task-card-grid">' +
                  '<span>AGV</span><span>' +
                  escapeText(task.agvCode + ' · ' + task.agvName) +
                  '</span><span>关联容器</span><span>' +
                  escapeText(task.object) +
                  '</span><span>起始位置</span><span>' +
                  escapeText(task.origin) +
                  '</span>' +
                  '<span>目标位置</span><span>' +
                  escapeText(task.destination) +
                  '</span><span>当前状态</span><span>' +
                  escapeText(task.status) +
                  '</span>' +
                  '<span>发起方式</span><span>' +
                  escapeText(task.method) +
                  '</span><span>发起时间</span><span>' +
                  escapeText(task.createdAt) +
                  '</span></div>' +
                  (cancellationRequests.has(task.id)
                    ? button('verify-cancel', '核实取消结果', 'nari-secondary-action', false, task.id)
                    : '<button type="button" class="nari-danger-action" data-action="cancel-logistics" data-task-id="' +
                      escapeText(task.id) +
                      '">取消任务</button>') +
                  '</div>'
                );
              })
              .join('');
            return (
              '<div class="nari-screen nari-work-screen">' +
              sequenceInput('容器码/AGV编号或名称', false) +
              '<div class="nari-list-scroll" data-list-scroll>' +
              (cards || '<div class="nari-section"><div class="nari-empty">暂无可取消任务</div></div>') +
              '</div></div>'
            );
          }

          function trafficControlScreen() {
            var traffic = state.traffic;
            var rows = traffic.items
              .map(function (area) {
                var occupied = area.status === '占用';
                return (
                  '<div class="nari-traffic-row" data-traffic-area="' +
                  escapeText(area.code) +
                  '"><div class="nari-traffic-head"><span><span class="nari-list-main">' +
                  escapeText(area.code) +
                  '</span><span class="nari-list-sub">' +
                  escapeText(area.name) +
                  '</span></span><span class="nari-tag' +
                  (occupied ? ' nari-tag--occupied' : '') +
                  '">' +
                  escapeText(area.status) +
                  '</span></div>' +
                  '<div class="nari-traffic-meta"><span>最后操作人</span><span>' +
                  escapeText(area.operator) +
                  '</span><span>操作时间</span><span>' +
                  escapeText(area.operatedAt) +
                  '</span><button type="button" class="' +
                  (occupied ? 'nari-secondary-action' : 'nari-danger-action') +
                  '" data-action="traffic-change" data-area-code="' +
                  escapeText(area.code) +
                  '" data-next-status="' +
                  (occupied ? '空闲' : '占用') +
                  '">' +
                  (occupied ? '释放' : '锁定') +
                  '</button></div></div>'
                );
              })
              .join('');
            return (
              '<div class="nari-screen nari-work-screen"><div class="nari-filter-stack"><input class="nari-input" data-traffic-filter="keyword" placeholder="区域编号或名称" aria-label="区域关键词" value="' +
              escapeText(traffic.keyword) +
              '">' +
              '<button type="button" class="nari-secondary-action" data-action="query-traffic">查询</button></div><div class="nari-filter-selects"><select class="nari-select" data-traffic-filter="status" aria-label="区域状态">' +
              '<option value="">全部状态</option><option value="空闲"' +
              (traffic.status === '空闲' ? ' selected' : '') +
              '>空闲</option><option value="占用"' +
              (traffic.status === '占用' ? ' selected' : '') +
              '>占用</option></select><button type="button" class="nari-ghost-action" data-action="refresh-traffic">下拉刷新</button></div>' +
              '<div class="nari-list-scroll" data-list-scroll>' +
              (rows || '<div class="nari-section"><div class="nari-empty">暂无交管区域</div></div>') +
              '</div></div>'
            );
          }

          function isNewBusiness(name) {
            return ['finished-shipping', 'warehouse-apply', 'warehouse-send'].indexOf(name) >= 0;
          }

          function newBusinessKey(name) {
            return name === 'finished-shipping' ? 'outbound' : name === 'warehouse-apply' ? 'inbound' : 'warehouse';
          }

          function newBusinessScreen(name) {
            var model = state[newBusinessKey(name)];
            var object = model.object;
            var send = name === 'warehouse-send';
            var placeholder = send
              ? '扫描或输入载具/位置编码'
              : name === 'finished-shipping'
                ? '扫描或输入位置/料车/料箱编码'
                : '扫描或输入载具/箱子编码';
            var available = object && (send ? model.destination && !model.reason : object.materials.length);
            var content = '<div class="nari-screen nari-work-screen">' + sequenceInput(placeholder, false);
            if (object) {
              content += detailBlock('对象信息', object.kind === 'carrier' ? '载具' : '料箱', [
                ['扫描编码', model.code],
                ['容器编号', object.code],
                ['当前位置', object.origin.code + ' · ' + object.origin.name],
                ['关联物料', object.materials.length + ' 件'],
              ]);
              if (send) {
                content +=
                  '<div class="nari-section"><div class="nari-section-heading"><span>目标地点</span><span>' +
                  model.destinations.length +
                  ' 个可选</span></div><div class="nari-section-body">' +
                  (model.destination
                    ? model.destinations.length === 1
                      ? '<div>' + escapeText(locationPath(model.destination)) + '</div>'
                      : '<button class="nari-choice-field" type="button" data-action="warehouse-destination"' +
                        (state.busy ? ' disabled' : '') +
                        '><span>' +
                        escapeText(locationPath(model.destination)) +
                        '</span><span>切换 ›</span></button>'
                    : '<div>暂无可用目标地点</div>') +
                  '</div></div>';
              }
              if (!object.materials.length)
                content +=
                  '<div class="nari-list-scroll" data-list-scroll>' +
                  emptyBlock('当前对象无可处理物料', '请核对对象或扫描其他容器') +
                  '</div>';
              else {
                var rows =
                  object.kind === 'box'
                    ? materialRows(object.materials)
                    : object.boxes
                        .map(function (box) {
                          return (
                            '<li><button type="button" class="nari-receipt-box" data-action="business-materials" data-code="' +
                            escapeText(box.code) +
                            '"' +
                            (state.busy ? ' disabled' : '') +
                            '><span><span class="nari-list-main">' +
                            escapeText(box.code) +
                            '</span><span class="nari-list-sub">' +
                            box.materials.length +
                            ' 件物料</span></span><span>查看物料 ›</span></button></li>'
                          );
                        })
                        .join('');
                content +=
                  '<div class="nari-section nari-scroll-panel"><div class="nari-section-heading"><span>' +
                  (object.kind === 'box' ? '关联物料' : '关联料箱') +
                  '</span><span>' +
                  (object.kind === 'box' ? object.materials.length + ' 件' : object.boxes.length + ' 箱') +
                  '</span></div><div class="nari-section-body nari-list-scroll" data-list-scroll><ul class="nari-list">' +
                  rows +
                  '</ul></div></div>';
              }
            } else
              content +=
                '<div class="nari-list-scroll">' +
                emptyBlock(model.reason || '请先扫描作业对象', '识别后查看关联信息，再确认提交') +
                '</div>';
            return (
              content +
              '<div class="nari-work-footer"><button type="button" class="nari-ghost-action" data-action="clear-page"' +
              (state.busy ? ' disabled' : '') +
              '>清空页面</button>' +
              '<button type="button" class="nari-primary-action" data-action="new-business-submit"' +
              (!available || state.busy ? ' disabled' : '') +
              '>' +
              (send ? '确认发起' : name === 'finished-shipping' ? '成品发货' : '确认申请') +
              '</button></div></div>'
            );
          }

          function queryNewBusiness(code) {
            var screen = state.screen;
            var key = newBusinessKey(screen);
            state[key] = { code: code, object: null, destinations: [], destination: null, reason: '' };
            runQuery(
              '正在查询对象及关联信息…',
              function () {
                var locationScan = /^(KW|JBT)-/.test(code);
                if (screen === 'warehouse-apply' && locationScan) throw new Error('请扫描载具或箱子编码');
                if (screen === 'warehouse-send' && /^BOX-/.test(code)) throw new Error('请扫描载具或位置编码');
                var kind = locationScan
                  ? code.indexOf('BOX') >= 0
                    ? 'box'
                    : 'carrier'
                  : /^CAR-/.test(code)
                    ? 'carrier'
                    : 'box';
                if (screen === 'warehouse-send' && locationScan && kind === 'box')
                  throw new Error('当前位置绑定的是料箱，不允许缴库发起');
                mockInfo(locationScan ? 'location' : kind, code);
                if (locationScan && code.indexOf('NONE') >= 0)
                  return { code: code, object: null, reason: '当前位置无可发货容器', destinations: [], destination: null };
                var objectCode = locationScan ? (kind === 'box' ? 'BOX-NR-240821' : 'CAR-NR-0098') : code;
                var materials =
                  code.indexOf('EMPTY') >= 0
                    ? []
                    : code.indexOf('LONG') >= 0
                      ? longMaterials.slice()
                      : demoMaterials.slice(0, 3);
                var boxes =
                  kind === 'carrier' && materials.length
                    ? materials.map(function (material, index) {
                        return { code: 'BOX-NR-' + (240821 + index), materials: [material] };
                      })
                    : [];
                if (screen === 'finished-shipping' && kind === 'carrier' && code.includes('MIX')) {
                  boxes = [
                    { code: 'BOX-MIX-01', materials: materials.slice(0, 2) },
                    { code: 'BOX-MIX-02', materials: materials.slice(2) },
                  ];
                }
                var destinations =
                  screen !== 'warehouse-send' || code.indexOf('NO-END') >= 0
                    ? []
                    : [
                        { floor: '一层', area: '成品库', name: '一号入库接驳台', code: 'JBT-WH-01' },
                        { floor: '一层', area: '成品库', name: '二号入库接驳台', code: 'JBT-WH-02' },
                        { floor: '二层', area: '立库区', name: '立库入库位', code: 'KW-WH-03' },
                      ];
                if (code.indexOf('SINGLE') >= 0) destinations = destinations.slice(0, 1);
                var reason = '';
                if (screen === 'warehouse-send' && code.indexOf('DENIED') >= 0)
                  throw new Error('当前对象不满足缴库发起条件，请先完成缴库申请');
                if (screen === 'warehouse-send' && !destinations.length) throw new Error('暂无可用目标地点');
                var result = {
                  code: code,
                  object: {
                    code: objectCode,
                    kind: kind,
                    materials: materials,
                    boxes: boxes,
                    origin: { code: locationScan ? code : 'KW-03-02', name: '三号缓存位' },
                  },
                  destinations: destinations,
                  destination: destinations[0] || null,
                  reason: reason,
                };
                root.dispatchEvent(
                  new CustomEvent('nari-mock-request', { detail: { action: screen + '-query', payload: { code: code } } }),
                );
                return result;
              },
              function (result) {
                state[key] = result;
              },
              function () {
                var model = state[key];
                if (model.reason) showToast(model.reason);
                else if (!model.object || !model.object.materials.length) showToast('当前对象无可处理物料');
              },
            );
          }

          function submitNewBusiness() {
            if (state.busy) return;
            var screen = state.screen;
            var model = state[newBusinessKey(screen)];
            if (
              !model.object ||
              (screen === 'warehouse-send' ? !model.destination || model.reason : !model.object.materials.length)
            )
              return;
            var object = model.object;
            runQuery(
              '正在提交，请稍候…',
              function () {
                // A single backend operation owns the ordered cross-system processing.
                // Each click sends a fresh request; the prototype does not resume prior steps.
                return mockRequest(
                  screen + '-submit',
                  {
                    scannedCode: model.code,
                    containerCode: object.code,
                    containerKind: object.kind,
                    destinationCode: model.destination ? model.destination.code : null,
                  },
                  {
                    number:
                      screen === 'warehouse-apply'
                        ? 'JK-20260907-001'
                        : screen === 'warehouse-send'
                          ? 'WL-20260907-001'
                          : 'FH-20260907-001',
                  },
                );
              },
              function (result) {
                clearPage();
                if (screen === 'finished-shipping' && object.kind === 'carrier') state.shippedObject = object;
                if (screen === 'warehouse-apply') result.number = addApplication(object);
                state.lastBusinessNumber = result.number;
              },
              function () {
                showToast(
                  (screen === 'warehouse-apply'
                    ? '缴库申请成功，缴库单号 '
                    : screen === 'warehouse-send'
                      ? '物流任务创建成功，任务编号 '
                      : '成品发货成功，发货单号 ') + state.lastBusinessNumber,
                  true,
                );
                if (state.shippedObject)
                  showModal(
                    '是否创建物流任务',
                    '<div class="nari-state-detail">成品发货已完成。是否为料车 ' +
                      escapeText(object.code) +
                      ' 创建物流任务？</div>',
                    '是',
                    'shipping-logistics',
                    '否',
                  );
              },
            );
          }

          function screenContent(name) {
            if (isNewBusiness(name)) return newBusinessScreen(name);
            if (name === 'home') return homeScreen();
            if (name === 'line-side-inbound') return inboundScreen();
            if (name === 'line-side-inbound-records') return recordsScreen();
            if (name === 'profile' || name === 'login') return accountScreen(name);
            if (name === 'unique-pack') return uniquePackScreen();
            if (name === 'order-pack') return orderPackScreen();
            if (name === 'carrier-bind') return carrierBindScreen();
            if (name === 'location-bind') return locationBindScreen();
            if (name === 'receive-box') return receiveBoxScreen();
            if (name === 'receive-carrier') return receiveBoxScreen();
            if (name === 'material-unbind') return materialUnbindScreen();
            if (name === 'carrier-unload') return carrierUnloadScreen();
            if (name === 'container-bind' || name === 'container-unbind') return containerRelationScreen();
            if (name === 'material-call') return materialCallScreen();
            if (name === 'logistics-create') return logisticsCreateScreen();
            if (name === 'empty-carrier-call') return emptyCarrierCallScreen();
            if (name === 'logistics-cancel') return logisticsCancelScreen();
            if (name === 'traffic-control') return trafficControlScreen();
            return pendingTasksScreen();
          }

          function render() {
            updateGuide();
            var oldList = root.querySelector('[data-list-scroll]');
            var listTop = renderedScreen === state.screen && oldList ? oldList.scrollTop : 0;
            root.querySelectorAll('[data-view]').forEach(function (button) {
              button.setAttribute('aria-pressed', String(button.getAttribute('data-view') === state.view));
            });
            picker.disabled = state.view !== 'prototype' || !!state.containerPrompt;
            picker.value = state.screen;
            var businessDemo = root.querySelector('[data-business-demo]');
            businessDemo.hidden = !isNewBusiness(state.screen) && !isContainerRelationScreen();
            businessDemo.disabled = state.busy || !!state.containerPrompt;
            var examples =
              state.screen === 'warehouse-send'
                ? [
                    ['CAR-NR-0098', '推荐多个地点'],
                    ['CAR-SINGLE', '仅一个目标地点'],
                    ['CAR-SCAN-FAIL', '扫描失败'],
                    ['CAR-LOCKED', '创建失败'],
                    ['CAR-LONG', '长列表'],
                    ['KW-03-02', '扫描位置'],
                  ]
                : [
                    ['CAR-NR-0098', '载具及料箱'],
                    ['BOX-NR-240821', '直接扫描料箱'],
                    ['CAR-EMPTY', '无关联物料'],
                    ['CAR-LOCKED', '提交失败'],
                    ['CAR-LONG', '长列表'],
                  ];
            if (state.screen === 'finished-shipping')
              examples = examples.concat([
                ['CAR-MIX', '混装料箱发货'],
                ['KW-03-02', '位置绑定料车'],
                ['KW-BOX', '位置绑定料箱'],
                ['KW-NONE', '位置没有容器'],
              ]);
            if (isContainerRelationScreen())
              examples =
                state.screen === 'container-bind'
                  ? [
                      ['normal', '普通绑定'],
                      ['existing', '已有绑定：保留或解绑'],
                      ['existing-long', '已绑定长列表'],
                      ['unbind-fail', '一键解绑失败'],
                      ['unbind-changed', '解绑前关系变化'],
                      ['rebind', '换绑确认'],
                      ['scan-fail', '扫描失败'],
                      ['submit-fail', '提交失败'],
                      ['changed', '关系已变化'],
                      ['long', '待绑定长列表'],
                    ]
                  : [
                      ['normal', '已绑定料箱'],
                      ['empty', '空料车'],
                      ['scan-fail', '扫描失败'],
                      ['submit-fail', '提交失败'],
                      ['changed', '关系已变化'],
                      ['long', '长列表'],
                    ];
            businessDemo.innerHTML =
              '<option value="">选择场景示例</option>' +
              examples
                .map(function (item) {
                  return '<option value="' + item[0] + '">' + item[1] + '</option>';
                })
                .join('');
            var demo = root.querySelector('[data-demo-controls]');
            demo.classList.toggle(
              'nari-demo-controls--business',
              isNewBusiness(state.screen) || isContainerRelationScreen(),
            );
            demo.hidden =
              state.view !== 'prototype' ||
              [
                'home',
                'profile',
                'login',
                'pending-tasks',
                'logistics-cancel',
                'traffic-control',
                'line-side-inbound',
                'line-side-inbound-records',
              ].indexOf(state.screen) >= 0;
            var boundButton = root.querySelector('[data-demo-bound]');
            boundButton.hidden = ['unique-pack', 'order-pack'].indexOf(state.screen) < 0;
            boundButton.disabled = state.busy || !!state.boxPrompt;
            root.querySelectorAll('[data-demo-location]').forEach(function (button) {
              button.hidden = state.screen !== 'location-bind';
              button.disabled = state.busy;
            });
            var sample = nextSample();
            var longButton = root.querySelector('[data-demo-long]');
            longButton.hidden =
              isContainerRelationScreen() ||
              ['unique-pack', 'carrier-bind', 'material-unbind', 'carrier-unload'].indexOf(state.screen) < 0;
            longButton.disabled = state.busy;
            var demoButton = root.querySelector('[data-demo-next]');
            demoButton.disabled = state.busy || !sample || !!state.boxPrompt || !!state.containerPrompt;
            demoButton.textContent = sample ? '演示扫码：' + sample : '录入完成';
            rendering = true;
            try {
              stage.innerHTML =
                state.view === 'architecture'
                  ? architecture()
                  : phone(screenContent(state.screen), labels[state.screen], state.screen === 'home');
            } finally {
              rendering = false;
            }

            var newList = root.querySelector('[data-list-scroll]');
            if (newList) newList.scrollTop = listTop;
            if (state.screen === 'line-side-inbound-records' || state.screen === 'logistics-cancel') {
              const input = stage.querySelector('[data-sequence-input]');
              if (input) {
                input.value = state.screen === 'logistics-cancel' ? state.cancelTasks.keyword : records.draft.box;
                stage.querySelector('[data-action="clear-scan"]').hidden = !input.value;
              }
            }
            renderedScreen = state.screen;
            if (state.view === 'prototype') renderContainerPrompt();
            if (state.boxPrompt && state.view === 'prototype') {
              var prompt = state.boxPrompt;
              var message =
                '当前箱子已绑定' +
                prompt.materials.length +
                '个物料，' +
                (prompt.mode === 'order-pack' ? '需要一键解绑后才可以使用此功能，请是否确认' : '是否需要一键解绑');
              showModal(
                '已有绑定物料',
                '<div class="nari-state-detail">' + message + '</div>',
                state.busy ? '解绑中…' : '是',
                'box-unbind',
                '否',
              );
              root.querySelectorAll('[role="dialog"] button').forEach(function (button) {
                button.disabled = state.busy;
              });
            }
          }

          function go(name) {
            receiptQuery = '';
            if ((state.screen === 'material-call' || isContainerRelationScreen()) && name !== state.screen) clearPage();
            requestRevision += 1;
            taskRevision += 1;
            state.boxPrompt = null;
            state.busy = false;
            if (name !== state.screen) state.history.push(state.screen);
            state.screen = name;
            state.view = 'prototype';
            if (name === 'logistics-cancel' && !state.cancelTasks.items.length) applyCancelFilters();
            if (name === 'traffic-control' && !state.traffic.items.length) applyTrafficFilters();
            render();
            if (name === 'pending-tasks') loadTasks(true);
            writeRoute(name);
          }

          function back() {
            receiptQuery = '';
            if (state.screen === 'material-call' || isContainerRelationScreen()) clearPage();
            requestRevision += 1;
            taskRevision += 1;
            state.boxPrompt = null;
            state.busy = false;
            state.screen = state.history.pop() || 'home';
            render();
            if (state.screen === 'pending-tasks') loadTasks(true);
            writeRoute(state.screen);
          }

          function showToast(message, success) {
            var device = root.querySelector('[data-device]');
            if (!device) return;
            var old = device.querySelector('.nari-toast');
            if (old) old.remove();
            var toast = document.createElement('div');
            toast.className = 'nari-toast' + (success ? ' nari-toast--success' : '');
            toast.setAttribute('role', success ? 'status' : 'alert');
            toast.textContent = message;
            {
              toast.style.maxHeight = '30%';
              toast.style.overflowY = 'auto';
              toast.style.pointerEvents = 'auto';
            }
            device.appendChild(toast);
            clearTimeout(toastTimer);
            toastTimer = setTimeout(
              function () {
                if (toast.parentNode) toast.remove();
              },
              success ? 2500 : 6500,
            );
          }

          function showModal(title, body, primaryLabel, primaryAction, closeLabel, meta) {
            var device = root.querySelector('[data-device]');
            if (!device) return;
            var shade = document.createElement('div');
            shade.className = 'nari-modal-shade';
            shade.innerHTML = [
              '<div class="nari-modal" role="dialog" aria-modal="true" aria-label="' + title + '">',
              '<div class="nari-modal-title"><span>' +
                title +
                '</span>' +
                (meta ? '<span class="nari-modal-meta">' + escapeText(meta) + '</span>' : '') +
                '</div>',
              '<div class="nari-modal-body">' + body + '</div>',
              '<div class="nari-modal-actions' + (!primaryAction ? ' nari-modal-actions--single' : '') + '">',
              '<button type="button" class="nari-ghost-action" data-modal-close>' + (closeLabel || '取消') + '</button>',
              primaryAction
                ? '<button type="button" class="nari-primary-action" data-modal-primary="' +
                  primaryAction +
                  '">' +
                  primaryLabel +
                  '</button>'
                : '',
              '</div>',
              '</div>',
            ].join('');
            device.appendChild(shade);
          }

          function optionMarkup(values, selected, placeholder) {
            return (
              '<option value=""' +
              (!selected ? ' selected' : '') +
              '>' +
              placeholder +
              '</option>' +
              values
                .map(function (value) {
                  return (
                    '<option value="' +
                    escapeText(value) +
                    '"' +
                    (value === selected ? ' selected' : '') +
                    '>' +
                    escapeText(value) +
                    '</option>'
                  );
                })
                .join('')
            );
          }

          function slotMarkup(items, selected) {
            return (
              '<option value=""' +
              (!selected ? ' selected' : '') +
              '>请选择库位</option>' +
              items
                .map(function (item) {
                  return (
                    '<option value="' +
                    escapeText(item.code) +
                    '"' +
                    (item.code === selected ? ' selected' : '') +
                    '>' +
                    escapeText(item.name) +
                    '</option>'
                  );
                })
                .join('')
            );
          }

          function cascadeItems(mode) {
            return mode === 'warehouse'
              ? state.warehouse.destinations
              : mode === 'destination'
                ? state.logistics.destinations
                : state.emptyCall.origins;
          }

          function showLocationCascade(mode) {
            var items = cascadeItems(mode);
            if (!items.length) return;
            var current =
              mode === 'warehouse'
                ? state.warehouse.destination
                : mode === 'destination'
                  ? state.logistics.destination
                  : state.emptyCall.origin;
            var selected = current || (mode === 'origin' ? items[0] : { floor: '', area: '', code: '' });
            state.cascadeSelection = { mode: mode, floor: selected.floor, area: selected.area, code: selected.code };
            var floors = Array.from(
              new Set(
                items.map(function (item) {
                  return item.floor;
                }),
              ),
            );
            var areas = Array.from(
              new Set(
                items
