                    : mockRequest('material-order', { materialCode: code }, mockInfo('material', code));
                },
                function (result) {
                  if (!needsBox) {
                    state.order.order = result.order;
                    state.order.representative = code;
                    state.order.quantity = '';
                    return;
                  }
                  result.box.boundQuantity =
                    result.box.code === 'BOX-ORDER' && !emptiedBoxes.has(code) ? 6 : result.materials.length;
                  if (result.materials.length)
                    state.boxPrompt = { mode: 'order-pack', box: result.box, materials: result.materials };
                  else state.order.box = result.box;
                },
              );
            } else if (state.screen === 'unique-pack') {
              if (state.pack.saved) return;
              var isBox = !state.pack.box;
              runQuery(
                isBox ? '正在获取箱子信息…' : '正在获取物料信息…',
                function () {
                  return isBox ? boxContents(code) : mockInfo('material', code);
                },
                function (item) {
                  if (isBox) {
                    state.pack.box = item.box;
                    if (item.materials.length)
                      state.boxPrompt = { mode: 'unique-pack', box: item.box, materials: item.materials };
                    return;
                  }
                  if (
                    state.pack.bound.some(function (row) {
                      return row.code === item.code;
                    })
                  )
                    throw new Error('该物料已绑定当前箱子，不能重复加入');
                  if (
                    state.pack.materials.some(function (row) {
                      return row.code === item.code;
                    })
                  )
                    throw new Error('重复扫码：' + item.code + ' 已在待绑定列表中');
                  state.pack.materials.push(item);
                  state.pack.note = '';
                },
              );
            } else if (state.screen === 'carrier-bind') {
              if (state.carrier.saved) return;
              var pairs = state.carrier.pairs;
              var pending = pairs.length && !pairs[pairs.length - 1].box;
              runQuery(
                pending ? '正在获取箱子信息…' : '正在获取载具库位信息…',
                function () {
                  return mockInfo(pending ? 'box' : 'slot', code);
                },
                function (item) {
                  if (pending) {
                    if (
                      pairs.some(function (pair) {
                        return pair.box && pair.box.code === item.code;
                      })
                    )
                      throw new Error('该箱子已在待装载列表中');
                    pairs[pairs.length - 1].box = item;
                  } else {
                    if (
                      pairs.some(function (pair) {
                        return pair.slot.code === item.code;
                      })
                    )
                      throw new Error('该载具库位已在待装载列表中');
                    pairs.push({ slot: item, box: null });
                  }
                },
              );
            } else if (state.screen === 'location-bind') {
              if (state.position.bound) {
                showToast('当前库位已绑定容器，请先解绑');
                return;
              }
              if (state.position.box || state.position.saved) {
                showToast('请先确认绑定或清空页面');
                return;
              }
              var needsLocation = !state.position.location;
              runQuery(
                needsLocation ? '正在获取库位及绑定容器…' : '正在获取容器信息…',
                function () {
                  if (needsLocation) return queryLocationInfo(code);
                  var kind = /^CAR-/.test(code) ? 'carrier' : 'box';
                  return Object.assign(mockInfo(kind, code), { kind: kind });
                },
                function (item) {
                  if (needsLocation) {
                    state.position.location = item.location;
                    state.position.bound = item.container;
                  } else state.position.box = item;
                },
              );
            }
          }

          function clearPage() {
            if (state.screen === 'material-call' && state.materialCall.attempt) return;
            if (state.screen === 'line-side-inbound') {
              if (lineDraft.request) return;
              lineDraft = freshDraft();
            }
            renderedScreen = '';
            requestRevision += 1;
            mixedApproval = null;
            state.busy = false;
            state.loadingText = '';
            state.boxPrompt = null;
            state.containerPrompt = null;
            if (isContainerRelationScreen())
              state[state.screen === 'container-bind' ? 'containerBind' : 'containerUnbind'] = {
                cart: null,
                boxes: [],
                bound: [],
                selected: [],
                failNextSubmission: false,
              };
            clearTimeout(toastTimer);
            if (state.screen === 'unique-pack') state.pack = { box: null, bound: [], materials: [], note: '', saved: false };
            if (state.screen === 'order-pack') state.order = { box: null, order: '', quantity: '', saved: false };
            if (state.screen === 'receive-box' || state.screen === 'receive-carrier')
              state.receipt = { task: null, note: '' };
            if (state.screen === 'material-unbind') state.unbind = { box: null, materials: [], selected: [], note: '' };
            if (state.screen === 'carrier-unload') state.unload = { carrier: null, boxes: [], selected: [], note: '' };
            if (state.screen === 'carrier-bind') state.carrier = { pairs: [], saved: false };
            if (state.screen === 'location-bind') state.position = { location: null, box: null, bound: null, saved: false };
            if (isNewBusiness(state.screen)) {
              state[newBusinessKey(state.screen)] = {
                code: '',
                object: null,
                destinations: [],
                destination: null,
                reason: '',
              };
              state.shippedObject = null;
            }
            if (state.screen === 'logistics-create')
              state.logistics = { object: null, origin: null, destinations: [], destination: null };
            if (state.screen === 'empty-carrier-call') state.emptyCall = { target: null, origins: [], origin: null };
            if (state.screen === 'material-call')
              state.materialCall = {
                location: null,
                order: '',
                queriedOrder: '',
                boxes: [],
                selected: [],
                eligibility: null,
                destinationVersion: null,
                attempt: null,
                receipt: null,
              };
            state.pendingReplacement = null;
            state.cascadeSelection = null;
            render();
          }

          root.addEventListener('input', function (event) {
            if (event.target.matches('[data-material-call-order]')) {
              var call = state.materialCall;
              call.order = event.target.value;
              root.querySelector('[data-action="material-call-query"]').disabled =
                !call.order.trim() || call.order.trim().length > 128 || state.busy || !!call.attempt;
              root.querySelector('[data-action="material-call-submit"]').disabled = !canMaterialCallSubmit();
            }
            if (event.target.matches('[data-order-field]')) {
              state.order[event.target.getAttribute('data-order-field')] = event.target.value;
              root.querySelector('[data-action="order-submit"]').disabled = !orderReady();
            }
            if (event.target.matches('[data-task-filter]'))
              state.tasks[event.target.getAttribute('data-task-filter')] = event.target.value;
            if (event.target.matches('[data-cancel-filter]'))
              state.cancelTasks[event.target.getAttribute('data-cancel-filter')] = event.target.value;
            if (event.target.matches('[data-traffic-filter]'))
              state.traffic[event.target.getAttribute('data-traffic-filter')] = event.target.value;
            if (event.target.matches('[data-sequence-input]')) {
              root.querySelector('[data-action="clear-scan"]').hidden = !event.target.value;
            }
          });

          root.addEventListener(
            'scroll',
            function (event) {
              var list = event.target;
              if (
                list.matches &&
                list.matches('[data-task-list]') &&
                list.scrollTop + list.clientHeight >= list.scrollHeight - 30 &&
                !state.tasks.error
              )
                loadTasks(false);
            },
            true,
          );

          root.addEventListener('focusout', function (event) {
            if (rendering) return;
            if (!event.target.matches('[data-sequence-input]') || !event.target.value.trim()) return;
            if (event.relatedTarget && event.relatedTarget.closest('button, select, input')) return;
            if (event.target.isConnected) processScan(event.target.value);
          });

          root.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' && !event.isComposing && event.target.matches('[data-material-call-order]')) {
              event.preventDefault();
              queryMaterialCall();
              return;
            }
            if (event.key === 'Enter' && !event.isComposing && event.target.matches('[data-task-filter]')) {
              event.preventDefault();
              loadTasks(true);
              return;
            }
            if (event.key === 'Enter' && !event.isComposing && event.target.matches('[data-cancel-filter]')) {
              event.preventDefault();
              applyCancelFilters();
              render();
              return;
            }
            if (event.key === 'Enter' && !event.isComposing && event.target.matches('[data-traffic-filter]')) {
              event.preventDefault();
              applyTrafficFilters();
              render();
              return;
            }
            if (event.key !== 'Enter' || event.isComposing || !event.target.matches('[data-sequence-input]')) return;
            event.preventDefault();
            processScan(event.target.value);
          });

          root.addEventListener('change', function (event) {
            if (event.target.matches('[data-material-call-box]') && !state.busy) {
              var call = state.materialCall;
              var selectedCode = event.target.getAttribute('data-material-call-box');
              if (
                call.attempt ||
                !call.eligibility.allowed ||
                !call.boxes.some(function (box) {
                  return box.boxCode === selectedCode && box.eligibility.allowed;
                })
              )
                return;
              if (event.target.checked && call.selected.length >= 1000) {
                event.target.checked = false;
                showToast('一次最多选择1000箱');
                return;
              }
              call.selected = call.selected.filter(function (code) {
                return code !== selectedCode;
              });
              if (event.target.checked) call.selected.push(selectedCode);
              render();
            }
            if (event.target.matches('[data-container-select]') && !state.busy && !state.containerPrompt) {
              var model = state.containerUnbind;
              var selectedBox = event.target.getAttribute('data-container-select');
              model.selected = model.selected.filter(function (code) {
                return code !== selectedBox;
              });
              if (event.target.checked) model.selected.push(selectedBox);
              render();
            }
            if (event.target === picker) go(picker.value);
            if (
              event.target.matches('[data-business-demo]') &&
              event.target.value &&
              !state.busy &&
              !state.containerPrompt
            ) {
              if (isContainerRelationScreen()) startContainerExample(event.target.value);
              else processScan(event.target.value);
            }
            if (event.target.matches('[data-cascade-level]'))
              updateCascade(event.target.getAttribute('data-cascade-level'), event.target.value);
            if (event.target.matches('select[data-cancel-filter]')) {
              applyCancelFilters();
              render();
            }
            if (event.target.matches('select[data-traffic-filter]')) {
              applyTrafficFilters();
              render();
            }
            if (event.target.matches('[data-unload-code]') && !state.busy && !root.querySelector('[role="dialog"]')) {
              var boxCode = event.target.getAttribute('data-unload-code');
              state.unload.selected = state.unload.selected.filter(function (item) {
                return item !== boxCode;
              });
              if (event.target.checked) state.unload.selected.push(boxCode);
              render();
            }
            if (event.target.matches('[data-unbind-code]') && !state.busy && !root.querySelector('[role="dialog"]')) {
              var code = event.target.getAttribute('data-unbind-code');
              state.unbind.selected = state.unbind.selected.filter(function (item) {
                return item !== code;
              });
              if (event.target.checked) state.unbind.selected.push(code);
              render();
            }
          });

          root.addEventListener('click', function (event) {
            var target = event.target.closest('button');
            if (target && workbenchClick(target)) return;
            if (!target || target.disabled) return;
            if (target.hasAttribute('data-demo-location')) {
              clearPage();
              var kind = target.getAttribute('data-demo-location');
              var slot = kind === 'carrier' ? 'KW-BOUND-CAR' : 'KW-BOUND-BOX';
              locationContainers.set(
                slot,
                kind === 'carrier'
                  ? { code: 'CAR-NR-0098', type: '周转载具', kind: 'carrier' }
                  : { code: 'BOX-NR-240821', type: '周转箱', kind: 'box' },
              );
              processScan(slot);
              return;
            }
            if (target.hasAttribute('data-demo-bound')) {
              clearPage();
              emptiedBoxes.delete('BOX-BOUND');
              processScan('BOX-BOUND');
              return;
            }
            if (target.hasAttribute('data-demo-long')) {
              clearPage();
              if (state.screen === 'material-unbind') {
                processScan('BOX-LONG');
                return;
              }
              if (state.screen === 'carrier-unload') {
                processScan('CAR-LONG');
                return;
              }
              if (state.screen === 'unique-pack')
                state.pack = {
                  box: mockInfo('box', 'BOX-NR-240816'),
                  bound: [],
                  materials: longMaterials.slice(),
                  note: '',
                  saved: false,
                };
              if (state.screen === 'carrier-bind')
                state.carrier = {
                  pairs: Array.from({ length: 12 }, function (_, index) {
                    return {
                      slot: mockInfo('slot', 'CS-0098-' + String(index + 1).padStart(2, '0')),
                      box: mockInfo('box', 'BOX-NR-' + (240816 + index)),
                    };
                  }),
                  saved: false,
                };
              render();
              return;
            }
            if (target.hasAttribute('data-demo-next')) {
              processScan(nextSample());
              return;
            }
            if (target.hasAttribute('data-view')) {
              requestRevision += 1;
              state.busy = false;
              state.view = target.getAttribute('data-view');
              render();
              return;
            }
            if (target.getAttribute('data-action') === 'new-business-submit') {
              submitNewBusiness();
              return;
            }
            if (target.getAttribute('data-action') === 'warehouse-destination') {
              showLocationCascade('warehouse');
              return;
            }
            if (target.getAttribute('data-action') === 'business-materials') {
              var current = state[newBusinessKey(state.screen)];
              var boxCode = target.getAttribute('data-code');
              var box =
                current.object &&
                current.object.boxes.find(function (item) {
                  return item.code === boxCode;
                });
              if (!box) return;
              runQuery(
                '正在获取箱内物料…',
                function () {
                  return mockRequest('business-box-materials', { boxCode: boxCode }, box.materials);
                },
                function () {},
                function () {
                  showModal(
                    '箱内物料',
                    '<div class="nari-modal-materials"><ul class="nari-list">' + materialRows(box.materials) + '</ul></div>',
                    '',
                    '',
                    '关闭',
                    boxCode + ' · ' + box.materials.length + ' 件',
                  );
                },
              );
              return;
            }
            if (target.hasAttribute('data-go')) {
              go(target.getAttribute('data-go'));
              return;
            }
            if (target.hasAttribute('data-back')) {
              back();
              return;
            }
            if (target.hasAttribute('data-modal-close')) {
              if (state.shippedObject) state.shippedObject = null;
              if (state.busy) return;
              if (state.boxPrompt && state.boxPrompt.mode === 'unique-pack') state.pack.bound = state.boxPrompt.materials;
              state.boxPrompt = null;
              if (state.containerPrompt && state.containerPrompt.kind === 'initial-unbind')
                state.containerBind.bound = state.containerPrompt.boxes;
              state.containerPrompt = null;
              state.pendingReplacement = null;
              state.cascadeSelection = null;
              target.closest('.nari-modal-shade').remove();
              render();
              return;
            }
            if (target.hasAttribute('data-modal-primary')) {
              var modalAction = target.getAttribute('data-modal-primary');
              if (
                modalAction === 'container-initial-unbind' &&
                state.containerPrompt &&
                state.containerPrompt.kind === 'initial-unbind' &&
                !state.busy
              ) {
                var model = state.containerBind;
                var boxes = state.containerPrompt.boxes.slice();
                runQuery(
                  '正在一键解绑料箱…',
                  function () {
                    mutateContainerRelations(false, boxes);
                    return Object.assign({}, relationCarts.get(model.cart.code));
                  },
                  function (cart) {
                    model.cart = cart;
                    model.bound = [];
                    state.containerPrompt = null;
                  },
                  function () {
                    showToast('解绑成功，可继续扫描料箱', true);
                  },
                );
                return;
              }
              if (modalAction === 'container-rebind' && state.containerPrompt && !state.busy) {
                state.containerBind.boxes.push(state.containerPrompt.box);
                state.containerPrompt = null;
                render();
                return;
              }
              if (modalAction === 'container-unbind-submit' && state.containerPrompt && !state.busy) {
                var model = state.containerUnbind;
                var boxes =
                  state.containerPrompt.kind === 'all'
                    ? model.boxes.slice()
                    : model.boxes.filter(function (box) {
                        return model.selected.indexOf(box.code) >= 0;
                      });
                if (boxes.length)
                  completeOperation(
                    '正在解绑料箱…',
                    function () {
                      return mutateContainerRelations(false, boxes);
                    },
                    '已解绑 ' + boxes.length + ' 个料箱',
                  );
                return;
              }
              if (modalAction === 'shipping-logistics' && state.shippedObject) {
                var shippedCode = state.shippedObject.code;
                state.shippedObject = null;
                go('logistics-create');
                state.logistics = { object: null, origin: null, destinations: [], destination: null };
                processScan(shippedCode);
                return;
              }
              if (modalAction === 'location-unbind' && state.position.bound) {
                var position = state.position;
                completeOperation(
                  '正在解绑容器…',
                  function () {
                    mockRequest(
                      'location-unbind',
                      {
                        locationCode: position.location.code,
                        containerCode: position.bound.code,
                        containerKind: position.bound.kind,
                      },
                      true,
                    );
                    locationContainers.delete(position.location.code);
                  },
                  '容器解绑成功',
                );
                return;
              }
              if (modalAction === 'box-unbind' && state.boxPrompt) {
                var prompt = state.boxPrompt;
                runQuery(
                  '正在一键解绑…',
                  function () {
                    mockRequest('box-unbind-all', { boxCode: prompt.box.code }, true);
                    emptiedBoxes.add(prompt.box.code);
                  },
                  function () {
                    if (prompt.mode === 'unique-pack') {
                      state.pack.box = prompt.box;
                      state.pack.bound = [];
                      state.boxPrompt = null;
                    } else {
                      state.order.box = boxContents(prompt.box.code).box;
                      state.boxPrompt = null;
                    }
                  },
                  function () {
                    showToast('解绑成功，可继续扫描板件', true);
                  },
                );
              }
              if (modalAction === 'replace-current' && state.pendingReplacement) {
                var replacement = state.pendingReplacement;
                state.pendingReplacement = null;
                clearPage();
                processScan(replacement);
              }
              if (modalAction.indexOf('cascade-confirm:') === 0 && state.cascadeSelection) {
                var selection = state.cascadeSelection;
                var selectedLocation =
                  cascadeItems(selection.mode).find(function (item) {
                    return item.code === selection.code;
                  }) || null;
                if (selection.mode === 'warehouse') state.warehouse.destination = selectedLocation;
                else if (selection.mode === 'destination') state.logistics.destination = selectedLocation;
                else state.emptyCall.origin = selectedLocation;
                state.cascadeSelection = null;
                render();
              }
              if (modalAction.indexOf('cancel-logistics:') === 0) {
                var taskId = modalAction.slice('cancel-logistics:'.length);
                if (taskId === 'AGV-20260904-0017') {
                  cancellationRequests.add(taskId);
                  render();
                  showToast('取消已受理，请核实最终结果');
                  return;
                }
                runQuery(
                  '正在取消物流任务…',
                  function () {
                    return mockRequest('logistics-cancel', { taskId: taskId }, true);
                  },
                  function () {
                    cancelTaskFixtures = cancelTaskFixtures.filter(function (item) {
                      return item.id !== taskId;
                    });
                    applyCancelFilters();
                  },
                  function () {
                    showToast('任务 ' + taskId + ' 已取消', true);
                  },
                );
              }
              if (modalAction.indexOf('traffic:') === 0) {
                var parts = modalAction.split(':');
                var areaCode = parts[1];
                var nextStatus = parts[2];
                runQuery(
                  '正在更新交管状态…',
                  function () {
                    return mockRequest('traffic-change', { areaCode: areaCode, status: nextStatus }, true);
                  },
                  function () {
                    var area = trafficFixtures.find(function (item) {
                      return item.code === areaCode;
                    });
                    if (area) {
                      area.status = nextStatus;
                      area.operator = '系统管理员';
                      area.operatedAt = '刚刚';
                    }
                    applyTrafficFilters();
                  },
                  function () {
                    showToast(areaCode + ' 已' + (nextStatus === '占用' ? '锁定' : '释放'), true);
                  },
                );
              }
              if (modalAction === 'clear-wms' && state.receipt.task) {
                var receipt = state.receipt.task;
                completeOperation(
                  '正在清空WMS历史…',
                  function () {
                    return mockRequest('clear-wms-history', { code: receipt.code, kind: receipt.kind }, true);
                  },
                  '当前对象的 WMS 历史已清空',
                );
              }
              if (modalAction.indexOf('go:') === 0) go(modalAction.slice(3));
              if (modalAction === 'unload-selected' || modalAction === 'unload-all') {
                var unload = state.unload;
                var boxCodes =
                  modalAction === 'unload-all'
                    ? unload.boxes.map(function (item) {
                        return item.code;
                      })
                    : unload.selected.slice();
                if (!boxCodes.length || state.busy) return;
                completeOperation(
                  '正在卸载箱子…',
                  function () {
                    return mockRequest('carrier-unload', { carrierCode: unload.carrier.code, boxCodes: boxCodes }, true);
                  },
                  '已卸载 ' + boxCodes.length + ' 箱',
                );
              }
              if (modalAction === 'unbind-selected' || modalAction === 'unbind-all') {
                var unbind = state.unbind;
                var codes =
                  modalAction === 'unbind-all'
                    ? unbind.materials.map(function (item) {
                        return item.code;
                      })
                    : unbind.selected.slice();
                if (!codes.length || state.busy) return;
                completeOperation(
                  '正在解绑物料…',
                  function () {
                    return mockRequest('material-unbind', { boxCode: unbind.box.code, materialCodes: codes }, true);
                  },
                  '已解绑 ' + codes.length + ' 件物料',
                );
              }
              return;
            }
            var action = target.getAttribute('data-action');
            if (['order-submit', 'pack-success'].includes(action)) {
              const model = action === 'order-submit' ? state.order : state.pack;
              if (model.box?.code === 'BOX-MIX' && !mixedApproval) {
                showModal('混料确认', '此箱将包含不同物料。继续后只可用于缴库，是否继续装箱？', '继续装箱', 'confirm-mixed');
                return;
              }
            }
            if (action === 'container-delete') {
              if (state.busy || state.containerPrompt) return;
              state.containerBind.boxes = state.containerBind.boxes.filter(function (box) {
                return box.code !== target.getAttribute('data-code');
              });
              render();
            } else if (action === 'container-bind-submit') {
              if (state.busy || state.containerPrompt || !state.containerBind.boxes.length) return;
              var boxes = state.containerBind.boxes.slice();
              completeOperation(
                '正在绑定料箱…',
                function () {
                  return mutateContainerRelations(true, boxes);
                },
                '已绑定 ' + boxes.length + ' 个料箱',
              );
            } else if (action === 'container-unbind-all' || action === 'container-unbind-selected') {
              if (state.busy || state.containerPrompt) return;
              var model = state.containerUnbind;
              var all = action === 'container-unbind-all';
              if (!(all ? model.boxes.length : model.selected.length)) return;
              state.containerPrompt = { kind: all ? 'all' : 'selected' };
              render();
            } else if (action === 'query-tasks' || action === 'retry-tasks') {
              loadTasks(action === 'query-tasks' || !state.tasks.page);
            } else if (action === 'choose-destination') {
              showLocationCascade('destination');
            } else if (action === 'choose-origin') {
              showLocationCascade('origin');

                '<input class="wb-input" aria-label="演示账号" placeholder="账号" value="' +
                (rememberDemoAccount ? 'pda-demo' : '') +

          function scanWorkbench(code) {
            switch (state.screen) {
              case 'line-side-inbound':
                scanLine(code);
                return true;
              case 'line-side-inbound-records':
                records.draft.box = code;
                queryRecords();
                return true;
              case 'logistics-cancel':
                state.cancelTasks.keyword = code;
                applyCancelFilters();
                render();
                return true;
              case 'receive-carrier':
              case 'receive-box':
                if (receiptFor(code)) return true;
                if (!['CAR-TRANSPORT', 'BOX-TRANSPORT'].includes(code)) {
                  state.receipt = { task: null, note: '当前箱子或载具无接收任务' };
                  render();
                  showToast(state.receipt.note);
                  return true;
                }
            }
            return false;
          }
          function workbenchClick(target) {
            if (target.disabled) return true;
            if (target.hasAttribute('data-reset')) {
              location.replace(location.href.split('#')[0] + '#home');
              location.reload();
              return true;
            }
            if (target.dataset.width) {
              root.style.setProperty('--pda-width', target.dataset.width + 'px');
              root.querySelectorAll('[data-width]').forEach((b) => b.setAttribute('aria-pressed', String(b === target)));
              return true;
            }
            const act = target.dataset.wb || target.dataset.modalPrimary;
            const value = target.dataset.value || '';
            switch (act) {
              case 'access':
                activeAccess = value;
                render();
                break;
              case 'sample':
                if (!state.busy) processScan(value);
                break;
              case 'scenario':
                lineDraft.scenario = value;
                showToast(value === 'timeout' ? '下次入库将演示回执超时' : '下次入库将演示箱版本冲突', true);
                break;
              case 'sites':
                showModal(
                  '选择入库地标',
                  '<label>扫描或输入地标<input class="wb-input" data-site-input placeholder="地标编码"></label>' +
                    button('pick-code', '确定') +
                    Object.entries(sites)
                      .map(([k, v]) => button('site', v + ' · ' + k, 'wb-card', false, k))
                      .join(''),
                  '',
                  '',
                  '关闭',
                );
                break;
              case 'verify-cancel':
                if (cancellationRequests.delete(value)) {
                  cancelTaskFixtures = cancelTaskFixtures.filter((t) => t.id !== value);
                  applyCancelFilters();
                  finish('已核实任务取消成功');
                }
                break;
              case 'cancel-blocking':
                blockingTask = 'ACCEPTED';
                finish('取消申请已受理，请核实结果');
                break;
              case 'verify-task':
                blockingTask = 'DONE';
                finish('已核实取消完成，库位可解绑');
                break;
              case 'confirm-mixed': {
                const action = state.screen === 'order-pack' ? 'order-submit' : 'pack-success';
                root.querySelector('.nari-modal-shade').remove();
                mixedApproval = { requestId: crypto.randomUUID(), confirmMixed: true, confirmationToken: 'demo-mixed' };
                stage.querySelector('[data-action="' + action + '"]').click();
                break;
              }
              case 'pick-code':
                chooseSite(root.querySelector('[data-site-input]').value.trim().toUpperCase());
                break;
              case 'site':
                chooseSite(value);
                break;
              case 'remove-box':
                lineDraft.boxes = lineDraft.boxes.filter((b) => b.code !== value);
                if (lineDraft.conflict === value) lineDraft.conflict = '';
                render();
                break;
              case 'clear-line':
                lineDraft = freshDraft();
                render();
                break;
              case 'recheck':
                lineDraft.conflict = '';
                finish('已重新预检');
                break;
              case 'inbound-submit':
                submitInbound();
                break;
              case 'more-records':
                records.more = !records.more;
                render();
                break;
              case 'query-records':
                queryRecords();
                break;
              case 'next-records':
                records.limit += 20;
                render();
                break;
              case 'reset-records':
                records.draft = blankFilters();
                queryRecords();
                break;
              case 'record-detail':
                recordDetail(value);
                break;
              case 'next-apps':
                loadTasks(false);
                break;
              case 'reject':
                showModal(
                  '确认不予上架',
                  '<p>所选 ' +
                    chosenApplications.size +
                    ' 笔申请的全部剩余箱将不予上架。</p><textarea data-reject-reason maxlength="500" aria-label="不予上架原因" placeholder="填写原因（必填，最多500字）"></textarea>',
                  '确认提交',
                  'reject-confirm',
                );
                root.querySelector('[data-modal-primary="reject-confirm"]').disabled = true;
                break;
              case 'reject-confirm': {
                const reason = root.querySelector('[data-reject-reason]').value.trim();
                if (!reason || reason.length > 500 || !chosenApplications.size) return true;
                applications
                  .filter((a) => chosenApplications.has(a.id))
                  .forEach((a) => {
                    a.rejected.push(...remaining(a));
                    a.reason = reason;
                  });
                loadTasks(true);
                showToast('已提交不予上架，清单已刷新', true);
                break;
              }
              case 'choose-receipt': {
                const code = state.receipt.choice;
                go('pending-tasks');
                receiptQuery = code;
                render();
                break;
              }
              case 'pick-application': {
                const [id, code] = value.split('|');
                receiptQuery = '';
                go('receive-box');
                openApplication(
                  applications.find((a) => a.id === id),
                  code,
                );
                break;
              }
              case 'clear-receipt':
                clearPage();
                render();
                break;
              case 'receipt-lines':
                showModal(
                  '箱内物料',
                  '<ul class="nari-list">' +
                    materialRows(state.receipt.task.application.materialMap?.[value] || [demoMaterials[0]]) +
                    '</ul>',
                  '',
                  '',
                  '关闭',
                  value,
                );
                break;
              case 'receive-application': {
                const t = state.receipt.task,
                  a = t.application;
                if (!t.boxCodes.every((b) => remaining(a).includes(b))) {
                  clearPage();
                  render();
                  showToast('申请范围已变化，请重新扫描');
                  break;
                }
                a.received.push(...t.boxCodes);
                clearPage();
                finish('缴库接收成功');
                break;
              }
              case 'offer-update':
                showModal('发现新版本', '发现新版本 1.0.8，是否立即更新？', '立即更新', 'install-update', '稍后');
                break;
              case 'install-update':
                runQuery(
                  '正在下载并安装演示资源包…',
                  () => true,
                  () => {},
                  () => showModal('更新完成', '新版本已安装，需要重启应用后生效。', '重启应用', 'restart-demo'),
                );
                break;
              case 'restart-demo':
                resourceVersion = '1.0.8';
                go('home');
                break;
              case 'logout':
                go('login');
                break;
              case 'address':
                showModal(
                  '自定义环境地址',
                  '<input class="wb-input" data-address aria-label="环境地址" value="' +
                    escapeText(demoAddress) +
                    '" placeholder="IP 或 IP:端口">',
                  '保存',
                  'save-address',
                );
                break;
              case 'save-address': {
                const raw = root.querySelector('[data-address]').value.trim();
                const match = raw.match(/^(?:https?:\/\/)?(\d{1,3}(?:\.\d{1,3}){3})(?::(\d{1,5}))?\/?$/i);
                if (
                  !match ||
                  match[1].split('.').some((n) => Number(n) > 255) ||
                  (match[2] && (+match[2] < 1 || +match[2] > 65535))
                )
                  return showToast('请输入有效 IPv4 地址和端口');
                demoAddress = /^https?:/i.test(raw) ? raw : 'http://' + raw;
                finish('演示地址已保存');
                break;
              }
              case 'login':
                if (
                  !root.querySelector('[aria-label="演示账号"]').value.trim() ||
                  !root.querySelector('[aria-label="演示密码"]').value
                )
                  showToast('请填写账号和密码');
                else if (customAddress && !demoAddress) showToast('请先填写自定义环境地址');
                else go('home');
                break;
              default:
                return false;
            }
            return true;
          }
          function writeRoute(name) {
            if (location.hash.slice(1) !== name) location.hash = name;
          }
          function initializeStudio() {
            root.addEventListener('input', (e) => {
              const el = e.target;
              if (el.matches('[data-reject-reason]'))
                root.querySelector('[data-modal-primary="reject-confirm"]').disabled = !el.value.trim();
              if (el.matches('[data-record-filter]')) records.draft[el.dataset.recordFilter] = el.value;
              if (el.matches('[data-sequence-input]') && state.screen === 'line-side-inbound-records')
                records.draft.box = el.value;
            });
            root.addEventListener('change', (e) => {
              const el = e.target;
              if (el.hasAttribute('data-application')) {
                if (el.checked) chosenApplications.add(el.dataset.application);
                else chosenApplications.delete(el.dataset.application);
                render();
              }
              if (el.hasAttribute('data-remember')) rememberDemoAccount = el.checked;
              if (el.hasAttribute('data-custom-address')) {
                customAddress = el.checked;
                if (customAddress && !demoAddress) root.querySelector('[data-wb="address"]').click();
              }
            });
            root.addEventListener('keydown', (e) => {
              if (e.key === 'Enter' && e.target.matches('[data-site-input]'))
                chooseSite(e.target.value.trim().toUpperCase());
            });
            root.addEventListener(
              'scroll',
              (e) => {
                const list = e.target;
                if (!list.matches?.('[data-list-scroll]') || list.scrollHeight - list.clientHeight - list.scrollTop > 24)
                  return;
                if (state.screen === 'line-side-inbound-records' && filteredRecords().length > records.limit) {
                  records.limit += 20;
                  render();
                }
                if (state.screen === 'pending-tasks' && state.tasks.items.length < state.tasks.total) loadTasks(false);
              },
              true,
            );
            picker.innerHTML =
              '<optgroup label="账户"><option value="home">首页</option><option value="profile">个人信息</option><option value="login">登录</option></optgroup>' +
              menuGroups
                .map(
                  ([group, entries]) =>
                    '<optgroup label="' +
                    group +
                    '">' +
                    entries.map(([, name, route]) => '<option value="' + route + '">' + name + '</option>').join('') +
                    '</optgroup>',
                )
                .join('');
            function syncRoute() {
              const key = location.hash.slice(1);
              const dest = Object.prototype.hasOwnProperty.call(labels, key) ? key : 'home';
              if (state.screen !== dest) go(dest);
            }
            window.addEventListener('hashchange', syncRoute);
            if (location.hash) syncRoute();
            render();
          }

          initializeStudio();
        })();
      </script>
    </div>
